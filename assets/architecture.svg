<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="476" viewBox="0 0 1440 476" role="img" aria-labelledby="figtitle figdesc">
  <title id="figtitle">LiOS-pi-GOAI 推理链路与组件归属</title>
  <desc id="figdesc">横向五段流程：训练栈产出 checkpoint，checkpoint 由单独交付提供，策略服务端加载后按 XPolicyLab v1.0.0 协议经 WebSocket 提供给评测端的 PiperX 双臂机器人。每段下方标注归属：训练栈与策略服务端属本仓库，checkpoint 单独交付不入库，协议层为官方组件零改动，机器人为评测端。底部注明本项目构建于 LiOS 栈的 lios-pi 子项目之上。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 1 L 11 6 L 0 11 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title    { font: 700 38px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#0f172a; letter-spacing:0; }
    .sub      { font: 400 18px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#64748b; letter-spacing:0; }
    .btitle   { font: 700 23px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#0f172a; letter-spacing:0; }
    .body     { font: 400 17px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#475569; letter-spacing:0; }
    .mono     { font: 400 15px "JetBrains Mono","DejaVu Sans Mono",monospace; fill:#64748b; letter-spacing:0; }
    .chip     { font: 600 16px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; letter-spacing:0; }
    .lineage  { font: 400 20px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#334155; letter-spacing:0; }
    .lin2     { font: 400 17px "Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Zen Hei",sans-serif; fill:#64748b; letter-spacing:0; }
    .mono2    { font: 400 17px "JetBrains Mono","DejaVu Sans Mono",monospace; fill:#2563eb; letter-spacing:0; }
  </style>

  <rect width="1440" height="476" fill="#ffffff"/>

  <text class="title" x="48" y="58">LiOS-pi-GOAI · 推理链路</text>
  <text class="sub"   x="48" y="90">自包含策略服务 + 官方评测栈零改动；六任务 Pi0.5 VLA，PiperX 双臂</text>

  <!-- ============ 主链路：五段 ============ -->
  <!-- 每段：x 由 48 + i*276 给出（宽 240，间距 36），竖直 y=130..326 -->

  <!-- 1 训练栈 -->
  <g>
    <rect x="48" y="130" width="240" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="btitle" x="66" y="172">训练栈</text>
    <text class="body"   x="66" y="206">FSDP 训练 / 多数据集</text>
    <text class="body"   x="66" y="232">norm stats 计算</text>
    <text class="mono"   x="66" y="258">src/pi/training</text>
    <rect x="66" y="276" width="204" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="chip" x="168" y="297" text-anchor="middle" fill="#1d4ed8">本仓库</text>
  </g>

  <!-- 2 Checkpoint -->
  <g>
    <rect x="324" y="130" width="240" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="btitle" x="342" y="172">Checkpoint</text>
    <text class="body"   x="342" y="206">ema/ （DCP 分片）</text>
    <text class="body"   x="342" y="232">norm_stats_pt.json</text>
    <text class="mono"   x="342" y="258">lion-vla-ckpt/</text>
    <rect x="342" y="276" width="204" height="32" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text class="chip" x="444" y="297" text-anchor="middle" fill="#b45309">单独交付 · 不入库</text>
  </g>

  <!-- 3 策略服务端 -->
  <g>
    <rect x="600" y="130" width="240" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="btitle" x="618" y="172">策略服务端</text>
    <text class="body"   x="618" y="206">Pi0.5 VLA 推理</text>
    <text class="body"   x="618" y="232">观测预处理 + 归一化</text>
    <text class="mono"   x="618" y="258">policy/lionvla</text>
    <rect x="618" y="276" width="204" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="chip" x="720" y="297" text-anchor="middle" fill="#1d4ed8">本仓库</text>
  </g>

  <!-- 4 协议 -->
  <g>
    <rect x="876" y="130" width="240" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="btitle" x="894" y="172">XPolicyLab</text>
    <text class="body"   x="894" y="206">v1.0.0 · WebSocket</text>
    <text class="body"   x="894" y="232">官方服务端与 client</text>
    <text class="mono"   x="894" y="258">hello → call → end</text>
    <rect x="894" y="276" width="204" height="32" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text class="chip" x="996" y="297" text-anchor="middle" fill="#15803d">官方 · 零改动</text>
  </g>

  <!-- 5 机器人 -->
  <g>
    <rect x="1152" y="130" width="240" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="btitle" x="1170" y="172">PiperX 双臂</text>
    <text class="body"   x="1170" y="206">六任务真机评测</text>
    <text class="body"   x="1170" y="232">14 维关节空间</text>
    <text class="mono"   x="1170" y="258">6 × 10 trials</text>
    <rect x="1170" y="276" width="204" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text class="chip" x="1272" y="297" text-anchor="middle" fill="#475569">评测端</text>
  </g>

  <!-- 连接箭头（画在卡片之后、语义上属背景层，此处用统一 y 通道） -->
  <line x1="294" y1="228" x2="316" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="228" x2="592" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="846" y1="228" x2="868" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1122" y1="228" x2="1144" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 血缘 ============ -->
  <line x1="48" y1="376" x2="1392" y2="376" stroke="#e2e8f0" stroke-width="1"/>
  <text class="lineage" x="48" y="410">构建于 LiOS 栈的 lios-pi 子项目之上 —— 上游为通用具身智能基础设施，本仓库承载 GOAI 2026 专项工作</text>
  <text class="lin2"    x="48" y="440">Upstream:</text>
  <text class="mono2"   x="145" y="440">github.com/cmriat/LiOS</text>
  <text class="lin2"    x="400" y="440">· 再上游改编自 openpi（Physical Intelligence）</text>
</svg>
